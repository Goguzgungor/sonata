app = "sonata-api"
primary_region = "ams"

[build]

[env]
  PORT = "8080"
  PUBLIC_BASE_URL = "https://api.sonata.brages.uk"
  CORS_ORIGINS = "https://sonata.brages.uk,http://localhost:3000"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
